name: עדכון נתוני מייטאון

on:
  schedule:
    - cron: '10 6 * * 0-4'   # ימים א׳–ה׳, 06:10 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytown-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # שליפה מהמקורות הציבוריים · מאיה, מגנא, ציטוט האג״ח ועיתונות.
      # נכשלת בשקט בכוונה: מקור שנפל מסומן כמיושן ואינו מוחק נתון קודם,
      # והיומן המלא נשמר ל-data/sources-status.json ומוצג בלשונית הבקרה.
      - name: שליפת מקורות
        run: node scripts/fetch-sources.mjs
        continue-on-error: true

      # פרסור ה-XBRL · שער הוולידציה. דוח שנכשל מסומן ואינו נבלע בשקט.
      - name: פרסור דוחות XBRL
        run: node scripts/parse-xbrl.mjs

      # התאמה וגזירה · משווה כל מספר ידני מול ה-XBRL, ורק אם אין סטייה
      # כותב את מה שה-XBRL מכסה. סטייה עוצרת את הכתיבה ומפילה את הריצה.
      - name: התאמה וגזירת נתונים
        id: build
        run: node scripts/build-app-data.mjs --write
        continue-on-error: true

      # שעון הדיווח · דוח שמאחר מייצר אזהרה גלויה בממשק Actions ובמייל
      # שגיטהאב שולח. בלי זה השעון היה כותב ל-JSON שאיש לא קורא.
      - name: התרעה על דוח שמאחר
        if: always()
        run: |
          node -e '
            const fs=require("fs");
            if(!fs.existsSync("data/reconcile.json")) process.exit(0);
            const n=JSON.parse(fs.readFileSync("data/reconcile.json","utf8")).nextReport;
            if(!n) process.exit(0);
            const line=n.period+" ליום "+n.balanceDate+" · צפי הגשה "+n.expectedFiling;
            if(n.daysLate>0)
              console.log("::warning title=דוח מאחר::"+line+" · מאחר ב-"+n.daysLate+
                " ימים ולא נטען. הורד את ה-XBRL ממגנא ל-data/xbrl/ והרץ scripts/parse-xbrl.mjs");
            else
              console.log("::notice title=הדוח הבא::"+line+" · "+n.status);
          '

      - name: שמירה ברפו
        if: always()
        run: |
          git config user.name "mytown-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "אין שינוי בנתונים"
          else
            git commit -m "נתונים: $(date -u +%Y-%m-%d)"
            git push
          fi

      # נכשל רק בסוף, אחרי שהנתונים והיומן כבר נשמרו — כדי שהכישלון יהיה
      # גלוי במייל של GitHub ובלשונית הבקרה, ולא ימחק את הראיות.
      - name: כישלון על סטייה בהתאמה
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::ההתאמה מצאה סטייה בין הנתונים הידניים ל-XBRL. ראה data/reconcile.json ואת לשונית הבקרה."
          exit 1
