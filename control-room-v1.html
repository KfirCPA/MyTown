<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מייטאון · חדר בקרה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* רקעים */
  --void:#070C10;
  --surface:#0E1820;
  --raised:#14222C;
  --sunken:#050A0D;
  --overlay:rgba(7,12,16,.72);
  --hairline:#1E323E;

  /* מבטא */
  --accent:#0FA9A0;
  --accent-glow:#2FD4C4;
  --positive:#34D399;
  --negative:#FF5A6E;
  --warning:#FFB547;
  --info:#3D8BFF;

  /* טקסט */
  --text-1:#E8F1F3;
  --text-2:#8FA6AF;
  --text-3:#5B7480;

  /* רדיוס */
  --r-sm:4px;
  --r-md:8px;
  --r-lg:14px;

  /* צל והילה */
  --shadow-card:0 2px 12px rgba(0,0,0,.4);
  --shadow-modal:0 16px 48px rgba(0,0,0,.6);
  --glow-accent:0 0 16px rgba(47,212,196,.22);
  --glow-alert:0 0 14px rgba(255,90,110,.35);

  /* גרדיאנטים */
  --grad-banner:linear-gradient(135deg,#0E1820 0%,#123A44 100%);
  --grad-card:linear-gradient(160deg,#101E28 0%,#0A1218 100%);
  --grad-active:linear-gradient(135deg,#0FA9A0 0%,#14808A 100%);
  --grad-bar:linear-gradient(270deg,rgba(15,169,160,.55),rgba(15,169,160,0));
  --grad-rule:linear-gradient(90deg,transparent,rgba(47,212,196,.4),transparent);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void);
  color:var(--text-1);
  font-family:'Assistant',system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ============ באנר ============ */
.banner{
  height:72px;
  background:var(--grad-banner);
  border-bottom:1px solid var(--accent);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;gap:16px;
  position:sticky;top:0;z-index:20;
}
.banner-id h1{font-size:24px;font-weight:600;letter-spacing:.02em;line-height:1.15}
.banner-id p{font-size:10px;letter-spacing:.05em;color:var(--text-3);margin-top:2px}
.banner-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.seg{display:flex;border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden}
.seg button{
  font-family:inherit;font-size:11px;letter-spacing:.05em;
  background:var(--raised);color:var(--text-2);
  border:none;padding:7px 13px;cursor:pointer;
  transition:background 120ms ease-out,color 120ms ease-out,border-color 120ms ease-out;
}
.seg button + button{border-inline-start:1px solid var(--hairline)}
.seg button:hover{color:var(--text-1)}
.seg button[aria-pressed="true"]{background:var(--grad-active);color:#fff}

.chip{
  font-size:10px;letter-spacing:.12em;padding:5px 10px;
  border-radius:var(--r-sm);
  background:rgba(15,169,160,.12);color:var(--accent-glow);
  border:1px solid rgba(47,212,196,.3);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.chip.is-warning{background:rgba(255,181,71,.12);color:var(--warning);border-color:rgba(255,181,71,.3)}
.chip.is-negative{background:rgba(255,90,110,.12);color:var(--negative);border-color:rgba(255,90,110,.3)}

.lamp{width:7px;height:7px;border-radius:50%;background:var(--positive);box-shadow:0 0 8px rgba(52,211,153,.5);flex:none}
.lamp.is-warning{background:var(--warning);box-shadow:none}
.lamp.is-negative{background:var(--negative);box-shadow:var(--glow-alert)}

/* ============ פריסה ============ */
main{padding:24px 32px 48px;max-width:1920px;margin:0 auto}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.span-2{grid-column:span 2}

@media (max-width:1599px){
  .kpi-row{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:1fr}
  .span-2{grid-column:auto}
}
@media (max-width:1099px){
  main{padding:20px 20px 40px}
  .banner{padding:0 20px}
}
@media (max-width:699px){
  .kpi-row{grid-template-columns:repeat(2,1fr);gap:12px}
  .banner{height:auto;padding:14px 16px;flex-direction:column;align-items:flex-start;position:static}
  .banner-tools{justify-content:flex-start}
  main{padding:16px 16px 40px}
}

/* ============ כרטיסים ============ */
.card{
  position:relative;overflow:hidden;
  background:var(--grad-card);
  border:1px solid var(--hairline);
  border-radius:var(--r-md);
  padding:16px;
  box-shadow:var(--shadow-card);
}
.card::before{
  content:"";position:absolute;top:-30px;inset-inline-start:-30px;
  width:90px;height:90px;pointer-events:none;
  background:radial-gradient(circle,rgba(47,212,196,.12) 0%,transparent 70%);
}
.card > *{position:relative}

.card h2{
  font-size:12px;font-weight:600;letter-spacing:.16em;
  color:var(--text-2);
  display:flex;align-items:center;gap:12px;
  margin-bottom:16px;
}
.card h2::after{content:"";flex:1;height:1px;background:var(--grad-rule)}

/* KPI */
.kpi .spark{height:22px;display:block;margin-bottom:8px;overflow:visible}
.kpi .val{font-size:26px;letter-spacing:-.01em;line-height:1.1;display:block}
.kpi .lbl{font-size:10px;letter-spacing:.05em;color:var(--text-3);margin-top:6px;display:block}
.kpi .cmp{font-size:11px;color:var(--text-2);margin-top:8px;display:flex;align-items:center;gap:5px}
.up{color:var(--positive)}
.down{color:var(--negative)}
.na{color:var(--text-3)}

/* ============ טבלה ============ */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{
  background:var(--raised);
  font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--text-3);
  text-align:start;padding:8px 10px;white-space:nowrap;
}
thead th.num{text-align:end;padding-inline-end:20px}
tbody td{
  padding:8px 10px;font-size:13px;
  border-bottom:1px solid rgba(30,50,62,.45);
  position:relative;
}
tbody td.num{text-align:end;padding-inline-end:20px;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
tbody tr{transition:background 120ms ease-out}
tbody tr:hover{background:rgba(20,34,44,.5)}
td .bar{
  position:absolute;inset-block:2px;inset-inline-end:0;
  background:var(--grad-bar);border-radius:var(--r-sm);pointer-events:none;
}
td .bar + span{position:relative}
tfoot td{
  padding:10px;background:var(--surface);
  border-top:1px solid var(--hairline);
  border-bottom:3px double rgba(15,169,160,.4);
  font-size:13px;font-weight:600;
}
tfoot td.num{text-align:end;padding-inline-end:20px;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

.link{color:var(--text-1);text-decoration:none;border-bottom:1px solid rgba(47,212,196,.35)}
.link:hover{border-bottom-color:var(--accent-glow)}

/* ============ מצבים ============ */
.empty{
  text-align:center;padding:32px 16px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.empty svg{stroke:var(--text-3);fill:none;stroke-width:1.25}
.empty p{color:var(--text-2);font-size:13px;max-width:46ch;line-height:1.7}
.empty .hint{color:var(--text-3);font-size:11px;letter-spacing:.04em}

.err{
  background:#2A1418;border:1px solid rgba(255,90,110,.4);
  border-radius:var(--r-sm);padding:12px 14px;
  color:var(--negative);font-size:13px;line-height:1.7;
}
.err b{display:block;margin-bottom:4px}

.skel{background:var(--raised);border-radius:var(--r-sm);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* התראות */
.alert-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-bottom:1px solid rgba(30,50,62,.45);
  font-size:13px;
}
.alert-row:last-child{border-bottom:none}
.alert-row .lamp{margin-top:6px}
.alert-row .t{color:var(--text-1)}
.alert-row .s{color:var(--text-3);font-size:11px;margin-top:2px}

/* פוקוס */
:focus-visible{outline:2px solid var(--accent-glow);outline-offset:2px}

/* גרפים */
.chart{width:100%;display:block;overflow:visible}
.chart .grid-line{stroke:var(--hairline);stroke-opacity:.4;stroke-width:1}
.chart .tick{fill:var(--text-3);font-size:10px;font-family:'JetBrains Mono',monospace}
.chart .serie-1{stroke:var(--accent-glow);fill:none;stroke-width:1.75}
.chart .serie-2{stroke:var(--info);fill:none;stroke-width:1.5}
.chart .dot-1{fill:var(--accent-glow)}
.enter{animation:rise 400ms ease-out backwards}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<header class="banner">
  <div class="banner-id">
    <h1>קבוצת מייטאון</h1>
    <p>TASE 2449 · התחדשות עירונית · ערכים בשקלים</p>
  </div>
  <div class="banner-tools">
    <div class="seg" role="group" aria-label="טווח תקופה">
      <button type="button" data-months="12" aria-pressed="true">12 ח׳</button>
      <button type="button" data-months="24" aria-pressed="false">24 ח׳</button>
      <button type="button" data-months="0" aria-pressed="false">הכל</button>
    </div>
    <span class="chip" id="statusChip"><span class="lamp"></span><span id="statusText">טוען</span></span>
  </div>
</header>

<main>
  <section class="kpi-row" id="kpis" aria-label="מדדים מרכזיים" aria-live="polite"></section>

  <div class="grid">
    <section class="card span-2">
      <h2>הכנסות ורווח · לאורך הרבעונים</h2>
      <div id="trend"></div>
    </section>

    <section class="card">
      <h2>התראות</h2>
      <div id="alerts"></div>
    </section>

    <section class="card span-2">
      <h2>תיק הפרויקטים</h2>
      <div id="projects"></div>
    </section>

    <section class="card">
      <h2>גשר רווח בין תקופות</h2>
      <div id="bridge"></div>
    </section>

    <section class="card span-2">
      <h2>עסקאות אחרונות</h2>
      <div id="deals"></div>
    </section>

    <section class="card">
      <h2>דיווחים במאיה</h2>
      <div id="reports"></div>
    </section>
  </div>
</main>

<script>
/* ---------- פורמט מספרים (סעיף 5) ---------- */
const NA = '<span class="na">—</span>';
function num(n){
  if(n===null||n===undefined||Number.isNaN(n)) return NA;
  if(n===0) return NA;
  const v = Math.round(n).toLocaleString('he-IL');
  return n<0 ? `(${Math.abs(Math.round(n)).toLocaleString('he-IL')})` : v;
}
function pct(n,digits=1){
  if(n===null||n===undefined||!Number.isFinite(n)) return NA;
  return n.toFixed(digits)+'%';
}
/* אחוז שינוי מוצג רק כשהבסיס משמעותי */
function delta(cur,base){
  if(!Number.isFinite(cur)||!Number.isFinite(base)||base<=0) return NA;
  const d=((cur-base)/base)*100;
  const cls = d>=0?'up':'down';
  const arrow = d>=0?'▲':'▼';
  return `<span class="${cls}">${arrow} ${Math.abs(d).toFixed(1)}%</span>`;
}
const toDate = s => { const d = new Date(s); return isNaN(d) ? null : d; };
const median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };

/* ---------- מצבים (סעיף 7) ---------- */
function empty(msg, hint){
  return `<div class="empty">
    <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/>
    </svg>
    <p>${msg}</p>${hint?`<p class="hint">${hint}</p>`:''}
  </div>`;
}
function errorBox(title,msg){
  return `<div class="err"><b>${title}</b>${msg}</div>`;
}
function skeleton(h=90){
  return `<div class="skel" style="height:${h}px"></div>`;
}

/* ---------- KPI ---------- */
function sparkline(values){
  if(!values || values.length<2) return '<svg class="spark" viewBox="0 0 100 22" preserveAspectRatio="none"></svg>';
  const min=Math.min(...values), max=Math.max(...values), rng=(max-min)||1;
  const pts=values.map((v,i)=>`${(i/(values.length-1))*100},${22-((v-min)/rng)*20-1}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--accent-glow)" stroke-width="1.25" vector-effect="non-scaling-stroke"/>
  </svg>`;
}
function kpi({value,label,compare,spark,delay=0}){
  return `<article class="card kpi enter" style="animation-delay:${delay}ms">
    ${sparkline(spark)}
    <span class="val mono">${value}</span>
    <span class="lbl">${label}</span>
    <span class="cmp">${compare??NA}</span>
  </article>`;
}

/* ---------- גרף קווים (תומך בשתי סדרות) ---------- */
function lineChart(series, opts={}){
  const s2=opts.series2||null, names=opts.names||null;
  if(!series.length || series.length<2) return empty(opts.emptyMsg||'אין מספיק נקודות זמן כדי לשרטט מגמה.',opts.emptyHint||'');
  const W=620,H=210,PT=18,PB=34,PS=58;
  const all=series.map(d=>d.v).concat(s2?s2.map(d=>d.v):[]);
  const min=Math.min(...all,0), max=Math.max(...all);
  const pad=(max-min)*0.12||1;
  const lo=min-pad, hi=max+pad;
  const x=i=>PS+(i/(series.length-1))*(W-PS-16);
  const y=v=>PT+(1-(v-lo)/((hi-lo)||1))*(H-PT-PB);
  const line=arr=>arr.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
  const gl=[];
  for(let i=0;i<=4;i++){
    const v=lo+((hi-lo)*i)/4, yy=y(v);
    gl.push(`<line class="grid-line" x1="${PS}" y1="${yy.toFixed(1)}" x2="${W-16}" y2="${yy.toFixed(1)}"/>
      <text class="tick" x="${PS-8}" y="${(yy+3).toFixed(1)}" text-anchor="end">${Math.round(v/1000).toLocaleString('he-IL')}</text>`);
  }
  if(lo<0&&hi>0) gl.push(`<line class="grid-line" style="stroke-opacity:.8" x1="${PS}" y1="${y(0).toFixed(1)}" x2="${W-16}" y2="${y(0).toFixed(1)}"/>`);
  const dots=(arr,cls)=>arr.map((d,i)=>`<circle class="${cls}" cx="${x(i).toFixed(1)}" cy="${y(d.v).toFixed(1)}" r="2.5"
    style="animation:rise 400ms ease-out backwards;animation-delay:${i*40}ms"><title>${d.label}: ${Math.round(d.v/1000).toLocaleString('he-IL')} אלפי ₪</title></circle>`).join('');
  const xt=series.map((d,i)=>`<text class="tick" x="${x(i).toFixed(1)}" y="${H-14}" text-anchor="middle">${d.label}</text>`).join('');
  const legend = names ? `<div style="display:flex;gap:16px;font-size:11px;color:var(--text-2);margin-top:8px">
      <span><span style="display:inline-block;width:14px;height:2px;background:var(--accent-glow);vertical-align:middle;margin-inline-end:6px"></span>${names[0]}</span>
      <span><span style="display:inline-block;width:14px;height:2px;background:var(--info);vertical-align:middle;margin-inline-end:6px"></span>${names[1]}</span>
    </div>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label||'מגמה'}">
    ${gl.join('')}
    ${s2?`<path class="serie-2 enter" d="${line(s2)}"/>`:''}
    <path class="serie-1 enter" d="${line(series)}"/>
    ${s2?dots(s2,'').replace(/class=""/g,'fill="var(--info)"'):''}
    ${dots(series,'dot-1')}${xt}
    <text class="tick" x="${PS-8}" y="${PT-6}" text-anchor="end">אלפי ₪</text>
  </svg>${legend}`;
}

/* ---------- גשר (Waterfall) ---------- */
function waterfall(steps){
  const W=380,H=230,PT=14,PB=54,PS=54;
  let run=0; const bars=[];
  steps.forEach(s=>{
    if(s.total){ bars.push({...s, from:0, to:s.value}); run=s.value; }
    else { bars.push({...s, from:run, to:run+s.value}); run+=s.value; }
  });
  const all=bars.flatMap(b=>[b.from,b.to]).concat(0);
  const lo=Math.min(...all), hi=Math.max(...all), rng=(hi-lo)||1;
  const y=v=>PT+(1-(v-lo)/rng)*(H-PT-PB);
  const bw=(W-PS-14)/bars.length*0.62, gap=(W-PS-14)/bars.length;
  const fmtK=v=>Math.round(v/1000).toLocaleString('he-IL');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="גשר מהכנסות לרווח נקי">
    <line class="grid-line" x1="${PS}" y1="${y(0).toFixed(1)}" x2="${W-8}" y2="${y(0).toFixed(1)}"/>
    ${bars.map((b,i)=>{
      const x=PS+i*gap+(gap-bw)/2;
      const yy=Math.min(y(b.from),y(b.to)), h=Math.max(Math.abs(y(b.to)-y(b.from)),1.5);
      const color=b.total?'var(--accent)':(b.value>=0?'var(--positive)':'var(--negative)');
      return `<g style="animation:rise 400ms ease-out backwards;animation-delay:${i*40}ms">
        <rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
              fill="${color}" fill-opacity="${b.total?.85:.65}" rx="2"><title>${b.label}: ${fmtK(b.value)} אלפי ₪</title></rect>
        <text class="tick" x="${(x+bw/2).toFixed(1)}" y="${(yy-5).toFixed(1)}" text-anchor="middle"
              fill="${b.value<0&&!b.total?'var(--negative)':'var(--text-2)'}">${fmtK(b.value)}</text>
        <text class="tick" x="${(x+bw/2).toFixed(1)}" y="${H-32}" text-anchor="middle">${b.label}</text>
      </g>`;}).join('')}
    <text class="tick" x="${PS}" y="${H-10}" fill="var(--text-3)">אלפי ₪</text>
  </svg>`;
}

/* ---------- רינדור ---------- */
let RAW=null, FIN=null, MONTHS=12;

function dealsInRange(deals){
  if(!deals) return [];
  const rows = deals.map(d=>({...d,_d:toDate(d.date)})).filter(d=>d._d && Number.isFinite(d.price) && d.price>0);
  if(!MONTHS) return rows.sort((a,b)=>b._d-a._d);
  const cut=new Date(); cut.setMonth(cut.getMonth()-MONTHS);
  return rows.filter(d=>d._d>=cut).sort((a,b)=>b._d-a._d);
}

function render(){
  const d=RAW;
  const bond   = d.bond?.data   || null;
  const rows   = dealsInRange(d.deals?.data);
  const reports= d.reports?.data|| null;

  /* --- סטטוס --- */
  const secs=[d.bond,d.reports,d.deals];
  const bad=secs.filter(s=>!s||!s.data).length;
  const stale=secs.filter(s=>s?.stale).length;
  const chip=document.getElementById('statusChip'), txt=document.getElementById('statusText');
  const lamp=chip.querySelector('.lamp');
  chip.className='chip'+(bad?' is-negative':stale?' is-warning':'');
  lamp.className='lamp'+(bad?' is-negative':stale?' is-warning':'');
  txt.textContent = bad ? `${bad} מקורות לא זמינים` : stale ? `${stale} מקורות מיושנים`
    : 'עודכן ' + new Date(d.updatedAt).toLocaleDateString('he-IL');

  /* --- KPI --- */
  const prices=rows.map(r=>r.price);
  const psqm=rows.filter(r=>r.sqm>0).map(r=>r.price/r.sqm);
  // חלוקה לשתי מחציות להשוואה תקופתית
  const half=Math.floor(rows.length/2);
  const recent=prices.slice(0,half), prior=prices.slice(half);
  const medRecent=median(recent), medPrior=median(prior);

  // סדרה חודשית לספארקליין ולגרף
  const byMonth=new Map();
  rows.forEach(r=>{
    const k=`${r._d.getFullYear()}-${String(r._d.getMonth()+1).padStart(2,'0')}`;
    if(!byMonth.has(k)) byMonth.set(k,[]);
    byMonth.get(k).push(r.price);
  });
  const monthly=[...byMonth.entries()].sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([k,v])=>({label:k.slice(5)+'/'+k.slice(2,4), v:median(v), n:v.length}));

  const bondPrice=parseFloat(String(bond?.lastPrice??'').replace(/,/g,''));
  const bondCap=parseFloat(String(bond?.seriesMarketCap??'').replace(/,/g,''));

  /* --- KPI פיננסי מ-XBRL --- */
  const allP = FIN?.periods || [];
  const QS = allP.filter(p=>p.months===3);              // רבעונים בלבד — לפריטי תוצאה
  const P  = allP.length ? allP[allP.length-1] : null;  // הדוח האחרון לפי תאריך מאזן
  const Q  = QS.length ? QS[QS.length-1] : null;
  const Qprev = QS.length>1 ? QS[QS.length-2] : null;
  const Bprev = allP.length>1 ? allP[allP.length-2] : null;
  const K = 1000;

  const FLOW = new Set(['Revenue','GrossProfit','ProfitLoss','ProfitLossFromOperatingActivities',
    'ProfitLossBeforeTax','CashFlowsFromUsedInOperatingActivities','CashFlowsFromUsedInInvestingActivities',
    'CashFlowsFromUsedInFinancingActivities','ComprehensiveIncome']);

  /* השוואה: פריט מאזן מול הדוח הקודם, פריט תוצאה רק מול רבעון קודם */
  function cmpFact(k){
    const isFlow = FLOW.has(k);
    const cur = isFlow ? Q : P;
    const base = isFlow ? Qprev : Bprev;
    if(!cur || !base) return '<span class="na">אין תקופת השוואה</span>';
    if(!Number.isFinite(cur.facts[k]) || !Number.isFinite(base.facts[k])) return NA;
    const suffix = isFlow ? 'מול הרבעון הקודם' : 'מול הדוח הקודם';
    return `${delta(cur.facts[k], base.facts[k])} ${suffix}`;
  }
  const serFlow = k => QS.map(p=>p.facts[k]).filter(Number.isFinite);
  const serBal  = k => allP.map(p=>p.facts[k]).filter(Number.isFinite);

  if(P){
    document.getElementById('kpis').innerHTML=[
      kpi({value:num(P.facts.Assets/K), label:'סך נכסים · אלפי ₪',
           compare:cmpFact('Assets'), spark:serBal('Assets'), delay:0}),
      kpi({value:num(P.facts.Equity/K), label:'הון עצמי · אלפי ₪',
           compare:cmpFact('Equity'), spark:serBal('Equity'), delay:40}),
      kpi({value:Q?num(Q.facts.Revenue/K):NA, label:`הכנסות · ${Q?.periodLabel??''}`,
           compare:cmpFact('Revenue'), spark:serFlow('Revenue'), delay:80}),
      kpi({value:Q?num(Q.facts.ProfitLoss/K):NA, label:`רווח נקי · ${Q?.periodLabel??''}`,
           compare:cmpFact('ProfitLoss'), spark:serFlow('ProfitLoss'), delay:120}),
      kpi({value:Q?num(Q.facts.CashFlowsFromUsedInOperatingActivities/K):NA, label:'תזרים מפעילות שוטפת',
           compare:cmpFact('CashFlowsFromUsedInOperatingActivities'),
           spark:serFlow('CashFlowsFromUsedInOperatingActivities'), delay:160}),
      kpi({value:Q?pct(Q.ratios.grossMargin*100):NA, label:'שיעור רווח גולמי',
           compare:Qprev?`${delta(Q.ratios.grossMargin, Qprev.ratios.grossMargin)} מול הרבעון הקודם`:NA,
           spark:QS.map(p=>p.ratios.grossMargin), delay:200}),
    ].join('');
  } else {
    document.getElementById('kpis').innerHTML=[
      kpi({value: Number.isFinite(bondPrice)?bondPrice.toFixed(2):NA, label:'שער אג״ח א׳ (אג׳)',
           compare: bond?.changePct ? `<span>${bond.changePct}</span> מול אתמול` : NA, delay:0}),
      kpi({value: Number.isFinite(bondCap)?num(bondCap):NA, label:'שווי שוק סדרה · אלפי ₪',
           compare:'<span class="na">אין בסיס השוואה</span>', delay:40}),
      kpi({value: rows.length?num(rows.length):NA, label:`עסקאות באזור · ${MONTHS?MONTHS+' ח׳':'הכל'}`,
           compare: half? `${delta(recent.length,prior.length)} מול המחצית הקודמת`:NA,
           spark: monthly.map(m=>m.n), delay:80}),
      kpi({value: medRecent?num(medRecent):NA, label:'מחיר עסקה חציוני · ₪',
           compare: (medRecent&&medPrior)? `${delta(medRecent,medPrior)} מול המחצית הקודמת`:NA,
           spark: monthly.map(m=>m.v), delay:120}),
      kpi({value: psqm.length?num(median(psqm)):NA, label:'מחיר חציוני למ״ר · ₪',
           compare: psqm.length? `<span class="na">מבוסס ${psqm.length} עסקאות</span>`:NA, delay:160}),
      kpi({value: reports?num(reports.length):NA, label:'דיווחים במאיה',
           compare:'<span class="na">ממתין לקבצי XBRL</span>', delay:200}),
    ].join('');
  }

  /* --- מגמה רבעונית: הכנסות מול רווח נקי --- */
  document.getElementById('trend').innerHTML = QS.length>1
    ? lineChart(
        QS.map(p=>({label:p.periodLabel.replace('רבעון ','Q'), v:p.facts.Revenue})),
        { series2: QS.map(p=>({label:p.periodLabel, v:p.facts.ProfitLoss})),
          names:['הכנסות','רווח נקי'], label:'הכנסות ורווח נקי לאורך הרבעונים' })
      + `<p style="font-size:11px;color:var(--text-3);margin-top:6px">רבעונים בלבד · דוחות שנתיים אינם מוצגים כאן כדי לא לערבב תקופות באורך שונה</p>`
    : empty('דרושים לפחות שני רבעונים כדי לשרטט מגמה.',
            `כרגע יש ${QS.length} רבעון. הוסף קבצי XBRL נוספים ל-data/xbrl.`);

  /* --- התראות --- */
  const alerts=[];
  secs.forEach((s,i)=>{
    const name=['נתוני אג״ח','דיווחי מאיה','עסקאות נדל״ן'][i];
    if(!s||!s.data) alerts.push({lvl:'is-negative',t:`${name} — אין נתונים`,s:s?.error||'המקור לא החזיר תשובה'});
    else if(s.stale) alerts.push({lvl:'is-warning',t:`${name} — מיושן`,s:`נשלף לאחרונה ${new Date(s.fetchedAt).toLocaleDateString('he-IL')}`});
  });
  // חריגות ולידציה של הדוחות — הדבר החשוב ביותר בפאנל
  (FIN?.periods||[]).forEach(p=>{
    p.validation.checks.filter(c=>!c.ok).forEach(c=>
      alerts.push({lvl:'is-negative',t:`${c.label} — לא מתאזן`,
        s:`${p.periodLabel}: ${Math.round(c.a).toLocaleString('he-IL')} מול ${Math.round(c.b).toLocaleString('he-IL')}`}));
  });
  (FIN?.continuity||[]).filter(c=>!c.ok).forEach(c=>
    alerts.push({lvl:'is-warning',t:'שינוי בהון לא מוסבר במלואו ברווח',
      s:`${c.from} → ${c.to}: פער ${Math.round(c.unexplained/1000).toLocaleString('he-IL')} אלפי ₪ (ייתכן הנפקה או דיבידנד)`}));
  if(Q && Q.facts.ProfitLossFromOperatingActivities>0 && Q.facts.ProfitLossBeforeTax<0){
    alerts.push({lvl:'is-warning',t:'הוצאות המימון מוחקות את הרווח התפעולי',
      s:`תפעולי ${Math.round(Q.facts.ProfitLossFromOperatingActivities/1000).toLocaleString('he-IL')} → לפני מס ${Math.round(Q.facts.ProfitLossBeforeTax/1000).toLocaleString('he-IL')} אלפי ₪`});
  }
  if(medRecent&&medPrior&&medPrior>0){
    const chg=((medRecent-medPrior)/medPrior)*100;
    if(Math.abs(chg)>=10) alerts.push({lvl:chg<0?'is-negative':'is-warning',
      t:`מחיר חציוני ${chg<0?'ירד':'עלה'} ב־${Math.abs(chg).toFixed(1)}%`,s:'בין מחצית התקופה הנוכחית לקודמת'});
  }
  document.getElementById('alerts').innerHTML = alerts.length
    ? alerts.map(a=>`<div class="alert-row"><span class="lamp ${a.lvl}"></span><div><div class="t">${a.t}</div><div class="s">${a.s}</div></div></div>`).join('')
    : `<div class="alert-row"><span class="lamp"></span><div><div class="t">כל המקורות עדכניים</div><div class="s">לא נמצאו חריגות בטווח שנבחר</div></div></div>`;

  /* --- תיק פרויקטים (אין מקור אוטומטי) --- */
  document.getElementById('projects').innerHTML = empty(
    'תיק הפרויקטים דורש נתונים מתוך הדוחות הכספיים — שלב, אחוז השלמה, הכנסות שהוכרו ומקדמות. הנתונים האלה קיימים בדוחות ה־PDF במאיה ואינם נשלפים אוטומטית כרגע.',
    'להפעלה: הוסף אדפטר שמפרסר את הביאור הרלוונטי, או טען קובץ projects.json לתיקיית data.'
  );

  /* --- גשר: מהכנסות לרווח נקי --- */
  if(Q && Number.isFinite(Q.facts.Revenue)){
    const f=Q.facts;
    document.getElementById('bridge').innerHTML =
      waterfall([
        {label:'הכנסות', value:f.Revenue, total:true},
        {label:'עלות', value:(f.GrossProfit-f.Revenue)},
        {label:'תפעול', value:(f.ProfitLossFromOperatingActivities-f.GrossProfit)},
        {label:'מימון', value:(f.ProfitLossBeforeTax-f.ProfitLossFromOperatingActivities)},
        {label:'מס', value:(f.ProfitLoss-f.ProfitLossBeforeTax)},
        {label:'נקי', value:f.ProfitLoss, total:true},
      ]) +
      `<p style="font-size:11px;color:var(--text-3);margin-top:10px;letter-spacing:.04em">
        ${Q.periodLabel} · ${Q.auditor??'רו״ח'} · ${Q.validation.passed?'עבר 5/5 בדיקות זהות':'נכשל בבדיקות'}
      </p>`;
  } else {
    document.getElementById('bridge').innerHTML = empty(
      'גשר הרווח מחייב דוח מתויג עם פירוק מהכנסות לרווח נקי.',
      'הנח קובץ .xbrl בתיקייה data/xbrl והרץ: node scripts/parse-xbrl.mjs'
    );
  }

  /* --- טבלת עסקאות --- */
  const top=rows.slice(0,12);
  const maxP=Math.max(...top.map(r=>r.price),1);
  document.getElementById('deals').innerHTML = !d.deals?.data
    ? errorBox('מקור העסקאות לא הגיב','ראה פאנל ההתראות. הנתון האחרון שנשמר יוצג ברגע שתתבצע שליפה מוצלחת.')
    : !top.length ? empty('לא נמצאו עסקאות בטווח שנבחר.','הרחב את הטווח באמצעות הבורר בראש המסך.')
    : `<div class="tbl-wrap"><table>
        <thead><tr><th>כתובת</th><th>תאריך</th><th class="num">חדרים</th><th class="num">מ״ר</th><th class="num">מחיר</th></tr></thead>
        <tbody>${top.map(r=>`<tr>
          <td>${r.address??NA}</td>
          <td class="mono" style="font-size:12px;color:var(--text-2)">${r._d.toLocaleDateString('he-IL')}</td>
          <td class="num">${r.rooms??NA}</td>
          <td class="num">${r.sqm?num(r.sqm):NA}</td>
          <td class="num"><span class="bar" style="width:${(r.price/maxP*100).toFixed(1)}%"></span><span>${num(r.price)}</span></td>
        </tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="4">חציון · ${top.length} עסקאות</td><td class="num">${num(median(top.map(r=>r.price)))}</td></tr></tfoot>
      </table></div>`;

  /* --- דיווחים --- */
  document.getElementById('reports').innerHTML = !reports
    ? errorBox('דיווחי מאיה לא נטענו', (d.reports?.error||'המקור לא הגיב') + '. עדכן את האדפטר maya-reports.')
    : !reports.length ? empty('לא נמצאו דיווחים.','בדוק שמספר המנפיק בסקריפט הוא 2449.')
    : `<div class="tbl-wrap"><table>
        <thead><tr><th>דיווח</th><th class="num">תאריך</th></tr></thead>
        <tbody>${reports.slice(0,8).map(r=>`<tr>
          <td>${r.url?`<a class="link" href="${r.url}" target="_blank" rel="noopener">${r.title}</a>`:r.title}</td>
          <td class="num" style="font-size:12px;color:var(--text-2)">${r.date?new Date(r.date).toLocaleDateString('he-IL'):NA}</td>
        </tr>`).join('')}</tbody></table></div>`;
}

/* ---------- בוררי תקופה ---------- */
document.querySelectorAll('.seg button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    MONTHS=Number(b.dataset.months);
    if(RAW) render();
  });
});

/* ---------- טעינה ---------- */
document.getElementById('kpis').innerHTML=Array.from({length:6},()=>`<div class="card">${skeleton(74)}</div>`).join('');
['trend','alerts','projects','bridge','deals','reports'].forEach(id=>{
  document.getElementById(id).innerHTML=skeleton(id==='trend'?200:120);
});

const grab = u => fetch(u+'?t='+Date.now()).then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)));

Promise.allSettled([grab('data/latest.json'), grab('data/financials.json')])
  .then(([mkt,fin])=>{
    if(fin.status==='fulfilled') FIN=fin.value;
    if(mkt.status==='fulfilled') return mkt.value;
    if(FIN) return {updatedAt:FIN.generatedAt, bond:null, reports:null, deals:null};
    throw new Error('no data');
  })
  .then(j=>{ RAW=j; render(); })
  .catch(e=>{
    document.getElementById('kpis').innerHTML='';
    document.getElementById('trend').innerHTML=errorBox(
      'לא נמצא הקובץ data/latest.json',
      'אם זו ההרצה הראשונה — פתח את לשונית Actions ברפו והרץ את "עדכון נתוני מייטאון" ידנית. הקובץ ייווצר ויישמר אוטומטית.');
    ['alerts','projects','bridge','deals','reports'].forEach(id=>document.getElementById(id).innerHTML=empty('ממתין לשליפה ראשונה.',''));
    document.getElementById('statusChip').className='chip is-negative';
    document.getElementById('statusChip').querySelector('.lamp').className='lamp is-negative';
    document.getElementById('statusText').textContent='אין נתונים';
  });
</script>
</body>
</html>
